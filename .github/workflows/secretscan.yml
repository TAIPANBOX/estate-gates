# The secret scan (CLAUDE.md invariant 23) for any repository in the estate.
#
# A repository calls it with one job, pinned to a commit of this repository:
#
#   jobs:
#     secretscan:
#       uses: TAIPANBOX/estate-gates/.github/workflows/secretscan.yml@<commit>
#       with:
#         scanner-ref: <the same commit>
#
# The commit is written twice because a reusable workflow cannot see the ref
# it was called at: `github.job_workflow_sha` is empty in the context (it is a
# claim of the OIDC token, not a context value), and the first version that
# relied on it checked out main, measured on heraldyx#93. It checks out the
# caller's tree and this repository's scanner at `scanner-ref`, and fails when the tree holds a value that looks
# like a secret and is not in the caller's `.secretscan-allow`. It prints masks
# and fingerprints, never a value.
#
# COST: nothing on a public repository (standard runner, a few seconds of Go).
# On a private one it would be metered, so there the pre-push hook on the
# developer's machine is the place, not this.

name: secretscan

on:
  workflow_call:
    inputs:
      scanner-ref:
        description: the estate-gates commit whose tools/secretscan runs; the same commit as the uses pin
        required: true
        type: string

permissions:
  contents: read

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false

      # The scanner at the commit the caller names, not at whatever main is
      # today: a caller that pins a commit gets that commit's rules.
      - name: The scanner commit is a full commit id
        env:
          REF: ${{ inputs.scanner-ref }}
        run: |
          echo "scanner-ref: $REF"
          echo "$REF" | grep -Eq '^[0-9a-f]{40}$' || { echo "scanner-ref must be a 40-hex commit"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/estate-gates
          ref: ${{ inputs.scanner-ref }}
          path: estate-gates
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: No secret in this repository's tree
        run: cd estate-gates/tools/secretscan && go run . -C "$GITHUB_WORKSPACE/target" tree
