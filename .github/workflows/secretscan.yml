# The secret scan (CLAUDE.md invariant 23) for any repository in the estate.
#
# A repository calls it with one job, pinned to a commit of this repository:
#
#   jobs:
#     secretscan:
#       uses: TAIPANBOX/estate-gates/.github/workflows/secretscan.yml@<commit>
#
# It checks out the caller's tree and this repository's scanner at the same
# commit the caller pinned, and fails when the tree holds a value that looks
# like a secret and is not in the caller's `.secretscan-allow`. It prints masks
# and fingerprints, never a value.
#
# COST: nothing on a public repository (standard runner, a few seconds of Go).
# On a private one it would be metered, so there the pre-push hook on the
# developer's machine is the place, not this.

name: secretscan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          persist-credentials: false

      # The scanner at the commit the caller pinned, not at whatever main is
      # today: a caller that pins a commit gets that commit's rules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TAIPANBOX/estate-gates
          ref: ${{ github.job_workflow_sha }}
          path: estate-gates
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: No secret in this repository's tree
        run: cd estate-gates/tools/secretscan && go run . -C "$GITHUB_WORKSPACE/target" tree
